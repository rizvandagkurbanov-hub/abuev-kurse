<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abuev</title>
<meta name="apple-mobile-web-app-title" content="Abuev">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#6b7694;--line:#e2e7f2;--accent:#3b5bdb;--accent-soft:#e8edff;--ok:#0b7a53;--radius:16px;--shadow:0 4px 20px rgba(0,0,0,0.04);}
[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa5c4;--line:#27314f;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cd6a0;--shadow:0 4px 20px rgba(0,0,0,0.2);color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;line-height:1.5;user-select:none;transition:background 0.3s, color 0.3s;}

/* Экран загрузки */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.4s ease, visibility 0.4s;}
#splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:90px;height:90px;border-radius:22px;box-shadow:0 10px 30px rgba(59,91,219,0.3);margin-bottom:20px;animation:pulse 2s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.splash-spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-top:20px;}

main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.logo-block{display:flex;align-items:center;gap:14px;}
.logo-img{width:52px;height:52px;border-radius:14px;box-shadow:var(--shadow);object-fit:cover;background:var(--card);}
.header-controls{display:flex;gap:8px;align-items:center;}
.theme-toggle{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;}
.lang-select{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;outline:none;cursor:pointer;box-shadow:var(--shadow);appearance:none;}
h1{font-size:26px;margin:0 0 2px;font-weight:800;}
.sub{color:var(--muted);font-size:13px;margin:0;font-weight:500;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:background 0.3s, border-color 0.3s;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px;font-weight:600;text-transform:uppercase;}
input{width:100%;font-family:'Inter',sans-serif;font-size:32px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:var(--text);outline:none;transition:all 0.3s;}
input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft);}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tab{font-family:'Inter',sans-serif;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:transform 0.1s, background 0.2s;}
.tab:active{transform:scale(0.95);}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,91,219,0.3);}

.filters{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);padding:4px;border-radius:14px;}
.filter-btn{font-family:'Inter',sans-serif;flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;transition:all 0.3s;}
.filter-btn.on{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.08);}

/* Анимация карточек */
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.res{display:flex;justify-content:space-between;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line);border-radius:8px;margin:0 -8px;animation:slideIn 0.3s ease forwards;opacity:0;touch-action:pan-y;}
.res:last-child{border-bottom:0}
.res.src{opacity:.6}
.res-left{flex:1;cursor:pointer;padding-right:12px;}
.res-right{text-align:right;cursor:pointer;padding:8px;margin:-8px;border-radius:10px;display:flex;flex-direction:column;align-items:flex-end;}
.code{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
.name{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500;}
.val-main{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;transition:opacity 0.1s;}
.val-sec{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
.one{color:var(--muted);font-size:12px;text-align:right;font-weight:500;margin-top:4px;}

.btn-share{background:var(--accent-soft);border:none;color:var(--accent);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:10px;transition:transform 0.1s;}
.btn-share:active{transform:scale(0.95);}

.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rates input{font-size:18px;padding:10px 14px;border-width:1px;}
.row{display:flex;gap:10px;margin-top:20px}
.btn{font-family:'Inter',sans-serif;flex:1;padding:16px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.1s;}
.btn:active{transform:scale(0.97);}
.note{color:var(--muted);font-size:13px;margin:16px 0 0;min-height:16px;text-align:center;font-weight:500;}
.h2{font-size:16px;font-weight:800;margin:0 0 16px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 28px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:all .3s;pointer-events:none;z-index:1000;text-align:center;}
#toast.show{opacity:1;bottom:100px;}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.chart-icon{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px;opacity:0;transition:opacity .3s;}
.modal.show{display:flex;opacity:1;}
.modal-content{background:var(--card);padding:24px;border-radius:24px;width:100%;max-width:380px;transform:scale(0.9);transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.modal.show .modal-content{transform:scale(1);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.modal-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px;}
.close-btn{background:var(--bg);border:none;font-size:24px;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chart-container{width:100%;height:200px;position:relative;}
[dir="rtl"]{text-align:right;}
[dir="rtl"] .res-right{text-align:left;align-items:flex-start;}
[dir="rtl"] .one{text-align:left;}
[dir="rtl"] .header{flex-direction:row-reverse;}
</style>
</head>

  </div>
</div>

<script>
function haptic(){if(navigator.vibrate)navigator.vibrate(10);}

// Переключение темы
function toggleTheme(){
  haptic();
  var body = document.body;
  var icon = document.getElementById('themeIcon');
  if(body.getAttribute('data-theme') === 'dark'){
    body.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>';
  } else {
    body.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  }
}
if(localStorage.getItem('theme') === 'dark'){ document.body.setAttribute('data-theme', 'dark'); }

// Поделиться результатом
function shareResult(amount, fromCur, toCur, result) {
  haptic();
  var text = amount + " " + fromCur + " = " + result + " " + toCur;
  if (navigator.share) {
    navigator.share({ title: 'Abuev Конвертер', text: text, url: window.location.href }).catch(console.error);
  } else {
    copyText(text);
  }
}
