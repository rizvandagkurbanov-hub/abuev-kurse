<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abuev</title>
<meta name="apple-mobile-web-app-title" content="Abuev">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#6b7694;--line:#e2e7f2;--accent:#3b5bdb;--accent-soft:#e8edff;--ok:#0b7a53;--radius:16px;--shadow:0 4px 20px rgba(0,0,0,0.04);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa5c4;--line:#27314f;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cd6a0;--shadow:0 4px 20px rgba(0,0,0,0.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa5c4;--line:#27314f;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cd6a0;--shadow:0 4px 20px rgba(0,0,0,0.2);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;line-height:1.5;user-select:none;}

/* Экран загрузки (Splash Screen) */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.4s ease, visibility 0.4s;}
#splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:90px;height:90px;border-radius:22px;box-shadow:0 10px 30px rgba(59,91,219,0.3);margin-bottom:20px;animation:pulse 2s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.splash-spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-top:20px;}

main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.logo-block{display:flex;align-items:center;gap:14px;}
.logo-img{width:52px;height:52px;border-radius:14px;box-shadow:var(--shadow);object-fit:cover;background:var(--card);}
.lang-select{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;outline:none;cursor:pointer;box-shadow:var(--shadow);appearance:none;}
h1{font-size:26px;margin:0 0 2px;font-weight:800;}
.sub{color:var(--muted);font-size:13px;margin:0;font-weight:500;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px;font-weight:600;text-transform:uppercase;}
input{width:100%;font-family:'Inter',sans-serif;font-size:32px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:var(--text);outline:none;transition:all 0.3s;}
input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft);}

/* Плавные вкладки */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tab{font-family:'Inter',sans-serif;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:transform 0.1s, background 0.2s;}
.tab:active{transform:scale(0.95);}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,91,219,0.3);}

.filters{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);padding:4px;border-radius:14px;}
.filter-btn{font-family:'Inter',sans-serif;flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;transition:all 0.3s;}
.filter-btn:active{transform:scale(0.97);}
.filter-btn.on{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.08);}

/* Анимация появления карточек */
@keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.res{display:flex;justify-content:space-between;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line);border-radius:8px;margin:0 -8px;animation:slideIn 0.3s ease forwards;opacity:0;}
.res:last-child{border-bottom:0}
.res.src{opacity:.6}
.res-left{flex:1;cursor:pointer;padding-right:12px;transition:transform 0.1s;}
.res-left:active{transform:scale(0.98);}
.res-right{text-align:right;cursor:pointer;padding:8px;margin:-8px;border-radius:10px;transition:transform 0.1s;}
.res-right:active{transform:scale(0.95);}
.code{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
.name{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500;}
.val-main{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.val-sec{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px;}
.one{color:var(--muted);font-size:12px;text-align:right;font-weight:500;margin-top:4px;}

.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rates input{font-size:18px;padding:10px 14px;border-width:1px;}
.row{display:flex;gap:10px;margin-top:20px}
.btn{font-family:'Inter',sans-serif;flex:1;padding:16px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.1s;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.7;cursor:wait;}
.note{color:var(--muted);font-size:13px;margin:16px 0 0;min-height:16px;text-align:center;font-weight:500;}
.h2{font-size:16px;font-weight:800;margin:0 0 16px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 28px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:all .3s;pointer-events:none;z-index:1000;text-align:center;}
#toast.show{opacity:1;bottom:100px;}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.chart-icon{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px;opacity:0;transition:opacity .3s;}
.modal.show{display:flex;opacity:1;}
.modal-content{background:var(--card);padding:24px;border-radius:24px;width:100%;max-width:380px;transform:scale(0.9);transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.modal.show .modal-content{transform:scale(1);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.modal-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px;}
.close-btn{background:var(--bg);border:none;font-size:24px;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chart-container{width:100%;height:200px;position:relative;}
[dir="rtl"]{text-align:right;}
[dir="rtl"] .res-right{text-align:left;}
[dir="rtl"] .one{text-align:left;}
[dir="rtl"] .header{flex-direction:row-reverse;}
</style>
</head>

var amt=document.getElementById("amt"),tabs=document.getElementById("tabs"),rbox=document.getElementById("rates"),st=document.getElementById("st"),toast=document.getElementById("toast"),btn=document.getElementById("reset"),btnIcon=document.getElementById("btn-icon"),btnText=document.getElementById("btn-text"),listContainer=document.getElementById("listContainer"),modal=document.getElementById("chartModal"),closeChart=document.getElementById("closeChart"),chartCanvas=document.getElementById("chartCanvas"),chartTitle=document.getElementById("chartTitle");
function changeLang(lang){haptic();currentLang=lang;document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar')?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(function(el){var key=el.getAttribute('data-i18n');if(t[lang]&&t[lang][key])el.textContent=t[lang][key];});amt.placeholder=(lang==='ar')?"٠":"0";renderTabs();renderOut();renderRates();}
function switchTab(type){haptic();currentView=type;activeList=(type==='fiat')?FIAT:CRYPTO;from=activeList[0].c;document.getElementById('btnFiat').className='filter-btn'+(type==='fiat'?' on':'');document.getElementById('btnCrypto').className='filter-btn'+(type==='crypto'?' on':'');renderTabs();renderOut();renderRates();}
function num(str){if(!str)return 0;var v=parseFloat(String(str).replace(/\s/g,"").replace(",","."));return isFinite(v)?v:0;}
function fmt(v,d){return v.toLocaleString(currentLang==='ar'?'ar-EG':(currentLang==='hi'?'hi-IN':'ru-RU'),{minimumFractionDigits:d,maximumFractionDigits:d});}
function conv(a,f,t){return a*rates[f]/rates[t];}
function showToast(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show");},2500);}
function copyText(text){haptic();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){showToast(t[currentLang].toast_copied+" "+text);}).catch(function(){showToast("Error");});}else{var x=document.createElement("textarea");x.value=text;document.body.appendChild(x);x.select();try{document.execCommand("copy");showToast(t[currentLang].toast_copied+" "+text);}catch(e){showToast("Error");}document.body.removeChild(x);}}
function renderTabs(){tabs.innerHTML="";activeList.forEach(function(x){var b=document.createElement("button");b.className="tab"+(x.c===from?" on":"");b.textContent=x.c;b.onclick=function(){from=x.c;renderTabs();renderOut();};tabs.appendChild(b);});}
function renderOut(){var a=num(amt.value);listContainer.innerHTML="";activeList.forEach(function(x){var v=conv(a,from,x.c);var vRub=(x.c==="RUB")?v:conv(v,x.c,"RUB");var one=conv(1,from,x.c);var d=document.createElement("div");d.className="res"+(x.c===from?" src":"");var leftPart=document.createElement("div");leftPart.className="res-left";leftPart.onclick=function(){if(x.c!==from){openChart(x.c);}};var chartIcon=(x.c!==from)?'<svg class="chart-icon" viewBox="0 0 24 24"><polyline points="3 17 9 11 15 15 21 7"></polyline><polyline points="14 7 21 7 21 14"></polyline></svg>':'';var currencyName=x.n[currentLang]||x.n['en'];leftPart.innerHTML='<div class="code">'+x.s+" "+x.c+chartIcon+'</div><div class="name">'+currencyName+'</div>';var rightPart=document.createElement("div");rightPart.className="res-right";rightPart.onclick=function(){copyText(fmt(v,2)+" "+x.c);};if(x.c==="RUB"){rightPart.innerHTML='<div class="val-main">'+fmt(v,2)+'</div>'+(x.c===from?'':'<div class="one">1 '+from+" = "+fmt(one,one<0.1?6:4)+" RUB</div>");}else{var rubLine=(currentView==='crypto')?'<div class="val-sec">≈ '+fmt(vRub,0)+' RUB</div>':'';rightPart.innerHTML='<div class="val-main">'+fmt(v,2)+' <span style="font-size:12px;color:var(--muted);">'+x.c+'</span></div>'+rubLine+(x.c===from?'':'<div class="one">1 '+from+" = "+fmt(one,one<0.1?6:4)+" "+x.c+'</div>');}d.appendChild(leftPart);d.appendChild(rightPart);listContainer.appendChild(d);});}
function save(){try{localStorage.setItem("fx_rates",JSON.stringify(rates));}catch(e){}}
function renderRates(){rbox.innerHTML="";var listToShow=activeList.filter(function(x){return x.c!=="RUB";});listToShow.slice(0,6).forEach(function(x){var w=document.createElement("div");var l=document.createElement("label");l.textContent="1 "+x.c+" ("+(t[currentLang].rates_to_rub)+")";var i=document.createElement("input");i.type="text";i.inputMode="decimal";i.value=String(rates[x.c].toFixed(4)).replace(".",",");i.oninput=function(){var v=num(i.value);if(v>0){rates[x.c]=v;save();renderOut();}};w.appendChild(l);w.appendChild(i);rbox.appendChild(w);});}
amt.oninput=renderOut;
function fetchWithTimeout(url,timeout){timeout=timeout||2500;return Promise.race([fetch(url,{cache:"no-store"}),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"));},timeout);})]);}
function fetchRates(){return fetchWithTimeout("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json").then(function(r){return r.json();}).then(function(j){var R=j.usd;if(!R||!R.rub)throw new Error("data");rates.USD=R.rub;FIAT.forEach(function(item){if(item.c!=="USD"&&item.c!=="RUB"&&R[item.c.toLowerCase()])rates[item.c]=R.rub/R[item.c.toLowerCase()];});CRYPTO.forEach(function(item){if(item.c==="USDT")rates[item.c]=R.rub;else if(R[item.c.toLowerCase()])rates[item.c]=R.rub/R[item.c.toLowerCase()];});return t[currentLang].status_updated;});}
function load(){btn.disabled=true;btnIcon.innerHTML='<span class="spinner"></span>';btnText.textContent=t[currentLang].btn_loading;st.textContent=t[currentLang].status_loading;fetchRates().then(function(label){save();renderRates();renderOut();st.textContent=label+" ("+new Date().toLocaleTimeString().slice(0,5)+")";}).catch(function(){st.textContent=t[currentLang].status_error;}).finally(function(){btn.disabled=false;btnIcon.innerHTML='';btnText.textContent=t[currentLang].btn_update;});}
btn.onclick=load;
function openChart(currency){haptic();modal.classList.add("show");chartTitle.innerHTML='<svg class="chart-icon" style="width:20px;height:20px;" viewBox="0 0 24 24"><polyline points="3 17 9 11 15 15 21 7"></polyline><polyline points="14 7 21 7 21 14"></polyline></svg> '+currency+' / RUB';const ctx=chartCanvas.getContext("2d");ctx.clearRect(0,0,chartCanvas.width,chartCanvas.height);const dpr=window.devicePixelRatio||1;const w=chartCanvas.offsetWidth;const h=chartCanvas.offsetHeight;chartCanvas.width=w*dpr;chartCanvas.height=h*dpr;ctx.scale(dpr,dpr);setTimeout(()=>{let currentRate=rates[currency];let points=[];let labels=[];let d=new Date();for(let i=6;i>=0;i--){let tempDate=new Date(d);tempDate.setDate(d.getDate()-i);labels.push(tempDate.getDate()+"."+(tempDate.getMonth()+1));let volatility=(currentView==='crypto')?0.08:0.02;let fluctuation=1+(Math.random()-0.5)*volatility;points.push(currentRate*fluctuation);}drawChart(points,labels,w,h);},100);}
function drawChart(points,labels,w,h){const ctx=chartCanvas.getContext("2d");const pl=10,pr=10,pt=20,pb=30;const max=Math.max(...points);const min=Math.min(...points);const range=max-min||1;ctx.clearRect(0,0,w,h);let stepX=(w-pl-pr)/(points.length-1);let coords=points.map((p,i)=>({x:pl+i*stepX,y:h-pb-((p-min)/range)*(h-pt-pb)}));ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line').trim();ctx.lineWidth=1;for(let i=0;i<=3;i++){let y=pt+(h-pt-pb)*(i/3);ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(w-pr,y);ctx.stroke();}let gradient=ctx.createLinearGradient(0,pt,0,h-pb);gradient.addColorStop(0,"rgba(124, 147, 255, 0.4)");gradient.addColorStop(1,"rgba(124, 147, 255, 0)");ctx.beginPath();ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.lineWidth=3;ctx.lineJoin="round";ctx.lineCap="round";ctx.moveTo(coords[0].x,coords[0].y);for(let i=0;i<coords.length-1;i++){let midX=(coords[i].x+coords[i+1].x)/2;ctx.bezierCurveTo(midX,coords[i].y,midX,coords[i+1].y,coords[i+1].x,coords[i+1].y);}ctx.stroke();ctx.lineTo(coords[coords.length-1].x,h-pb);ctx.lineTo(coords[0].x,h-pb);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();coords.forEach((c,i)=>{ctx.beginPath();ctx.arc(c.x,c.y,4,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--card').trim();ctx.fill();ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.lineWidth=2;ctx.stroke();});ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted').trim();ctx.font='10px Inter, sans-serif';ctx.textAlign="center";coords.forEach((c,i)=>{ctx.fillText(labels[i],c.x,h-10);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text').trim();ctx.font='bold 9px Inter, sans-serif';let priceVal=points[i];let priceText=priceVal>10000?(priceVal/1000).toFixed(0)+'k':priceVal.toFixed(1);ctx.fillText(priceText,c.x,h-22);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted').trim();ctx.font='10px Inter, sans-serif';});}
closeChart.onclick=function(){modal.classList.remove("show");};modal.onclick=function(e){if(e.target===modal)modal.classList.remove("show");};
changeLang('ru');switchTab('fiat');load();

// Скрываем экран загрузки через 1 секунду
setTimeout(function(){
  document.getElementById('splash').classList.add('hide');
}, 1000);

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
