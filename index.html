<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abuev</title>
<meta name="apple-mobile-web-app-title" content="Abuev">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💱%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#6b7694;--line:#e2e7f2;--accent:#3b5bdb;--accent-soft:#e8edff;--ok:#0b7a53}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa5c4;--line:#27314f;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cd6a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa5c4;--line:#27314f;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cd6a0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;font-size:28px;font-weight:600;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tab{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.res{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.2s;}
.res:active{background:var(--accent-soft);}
.res:last-child{border-bottom:0}
.res.src{opacity:.55}
.code{font-weight:700;font-size:16px}
.name{color:var(--muted);font-size:12px}
.val{font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.one{color:var(--muted);font-size:12px;text-align:right;font-weight:400}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rates input{font-size:17px;padding:8px 10px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:disabled{opacity:0.7;cursor:wait;}
.note{color:var(--muted);font-size:12px;margin:10px 0 0;min-height:16px;}
.h2{font-size:15px;font-weight:700;margin:0 0 10px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:1000;}
#toast.show{opacity:1;}

/* Анимация загрузки (спиннер) */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(59, 91, 219, 0.3);border-radius:50%;border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<main>
  <h1>Abuev</h1>
  <p class="sub">Конвертер валют: USD, EUR, AED, RUB, JPY, TRY, CNY</p>

  <div class="card">
    <label for="amt">Сумма</label>
    <input id="amt" type="text" inputmode="decimal" value="100" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="card" id="out"></div>

  <div class="card">
    <p class="h2">Курсы к рублю</p>
    <div class="rates" id="rates"></div>
    <div class="row">
      <button class="btn" id="reset"><span id="btn-icon"></span><span id="btn-text">Обновить курс</span></button>
    </div>
    <p class="note" id="st">Загружаю курс…</p>
  </div>
</main>
<div id="toast">Скопировано!</div>

<script>
(function(){
  var CUR=[
    {c:"USD",n:"Доллар США",s:"$"},
    {c:"EUR",n:"Евро",s:"€"},
    {c:"AED",n:"Дирхам ОАЭ",s:"د.إ"},
    {c:"RUB",n:"Российский рубль",s:"₽"},
    {c:"JPY",n:"Японская иена",s:"¥"},
    {c:"TRY",n:"Турецкая лира",s:"₺"},
    {c:"CNY",n:"Китайский юань",s:"元"}
  ];
  var DEF={USD:80.6761,EUR:89.8167,AED:21.9676,RUB:1,JPY:0.510705,TRY:1.62181,CNY:12.0844};
  var rates=Object.assign({},DEF);
  var from="USD";
  try{var s=localStorage.getItem("fx_rates");if(s){var p=JSON.parse(s);for(var k in DEF){if(p[k]>0)rates[k]=p[k];}}}catch(e){}
  rates.RUB=1;

  var amt=document.getElementById("amt");
  var tabs=document.getElementById("tabs");
  var out=document.getElementById("out");
  var rbox=document.getElementById("rates");
  var st=document.getElementById("st");
  var toast=document.getElementById("toast");
  var btn=document.getElementById("reset");
  var btnIcon=document.getElementById("btn-icon");
  var btnText=document.getElementById("btn-text");

  function num(str){var v=parseFloat(String(str).replace(/\s/g,"").replace(",","."));return isFinite(v)?v:0;}
  function fmt(v,d){return v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});}
  function conv(a,f,t){return a*rates[f]/rates[t];}

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function(){ toast.classList.remove("show"); }, 2000);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){
        showToast("Скопировано: " + text);
      }).catch(function(){ showToast("Ошибка копирования"); });
    } else {
      var t = document.createElement("textarea");
      t.value = text;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); showToast("Скопировано: " + text); } catch(e) { showToast("Ошибка"); }
      document.body.removeChild(t);
    }
  }

  function renderTabs(){
    tabs.innerHTML="";
    CUR.forEach(function(x){
      var b=document.createElement("button");
      b.className="tab"+(x.c===from?" on":"");
      b.textContent=x.c;
      b.onclick=function(){from=x.c;renderTabs();renderOut();};
      tabs.appendChild(b);
    });
  }
  function renderOut(){
    var a=num(amt.value);
    out.innerHTML="";
    CUR.forEach(function(x){
      var v=conv(a,from,x.c);
      var one=conv(1,from,x.c);
      var d=document.createElement("div");
      d.className="res"+(x.c===from?" src":"");
      
      d.onclick = function() {
        if (x.c !== from) {
          copyText(fmt(v, 2));
        }
      };

      d.innerHTML='<div><div class="code">'+x.s+" "+x.c+'</div><div class="name">'+x.n+'</div></div>'+
        '<div><div class="val">'+fmt(v,2)+'</div>'+
        (x.c===from?'':'<div class="one">1 '+from+" = "+fmt(one,one<0.1?6:4)+" "+x.c+'</div>')+'</div>';
      out.appendChild(d);
    });
  }
  function save(){try{localStorage.setItem("fx_rates",JSON.stringify(rates));}catch(e){}}
  function renderRates(){
    rbox.innerHTML="";
    CUR.filter(function(x){return x.c!=="RUB";}).forEach(function(x){
      var w=document.createElement("div");
      var l=document.createElement("label");l.textContent="1 "+x.c+" в рублях";
      var i=document.createElement("input");
      i.type="text";i.inputMode="decimal";
      
      // Округляем до 4 знаков для аккуратного отображения
      i.value=String(rates[x.c].toFixed(4)).replace(".",",");
      
      i.oninput=function(){var v=num(i.value);if(v>0){rates[x.c]=v;save();renderOut();}};
      w.appendChild(l);w.appendChild(i);rbox.appendChild(w);
    });
  }
  amt.oninput=renderOut;

  var CODES=["USD","EUR","AED","JPY","TRY","CNY"];
  
  // Таймаут 2.5 секунды, чтобы не ждать блокировку
  function fetchWithTimeout(url, timeout) {
    timeout = timeout || 2500; 
    return Promise.race([
      fetch(url, {cache: "no-store"}),
      new Promise(function(_, reject) { setTimeout(function() { reject(new Error("timeout")); }, timeout); })
    ]);
  }

  function fromMarket(){
    return fetchWithTimeout("https://open.er-api.com/v6/latest/USD")
      .then(function(r){if(!r.ok)throw new Error("http");return r.json();})
      .then(function(j){
        var R=j.rates;
        if(j.result!=="success"||!(R&&R.RUB>0))throw new Error("data");
        CODES.forEach(function(k){if(R[k]>0)rates[k]=R.RUB/R[k];});
        return "Рыночный курс";
      });
  }
  
  function fromBackup(){
    return fetchWithTimeout("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json")
      .then(function(r){if(!r.ok)throw new Error("http");return r.json();})
      .then(function(j){
        var R = j.usd;
        if(!R || !R.rub) throw new Error("data");
        rates.USD = R.rub; 
        rates.EUR = R.rub / R.eur;
        rates.AED = R.rub / R.aed;
        rates.JPY = R.rub / R.jpy;
        rates.TRY = R.rub / R.try;
        rates.CNY = R.rub / R.cny;
        return "Резервный курс (CDN)";
      });
  }

  function fromCbr(){
    return fetchWithTimeout("https://www.cbr-xml-daily.ru/daily_json.js")
      .then(function(r){if(!r.ok)throw new Error("http");return r.json();})
      .then(function(j){
        CODES.forEach(function(k){var v=j.Valute[k];if(v&&v.Value>0)rates[k]=v.Value/v.Nominal;});
        return "Курс ЦБ РФ";
      });
  }

  function load(){
    // Включаем спиннер
    btn.disabled = true;
    btnIcon.innerHTML = '<span class="spinner"></span>';
    btnText.textContent = "Загрузка...";
    st.textContent = "Обновляю курсы…";

    // Очередь: Рыночный -> Резервный (CDN) -> ЦБ
    fromMarket()
      .catch(fromBackup)
      .catch(fromCbr)
      .then(function(label){
        save();
        renderRates();
        renderOut();
        st.textContent = label + ". Обновлено: " + new Date().toLocaleTimeString("ru-RU").slice(0,5);
      })
      .catch(function(){
        st.textContent = "Нет связи. Используется сохранённый курс.";
      })
      .finally(function(){
        // Выключаем спиннер
        btn.disabled = false;
        btnIcon.innerHTML = '';
        btnText.textContent = "Обновить курс";
      });
  }

  btn.onclick=load;

  renderTabs();renderRates();renderOut();load();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
